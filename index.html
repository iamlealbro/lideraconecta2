<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EBDD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LideraConecta">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LideraConecta (PEI-MVP)</title>
<style>
@font-face{font-family:"Archivo";src:url(fonts/archivo-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:"Newsreader";src:url(fonts/newsreader-latin-wght-italic.woff2) format("woff2");font-weight:200 800;font-style:italic;font-display:swap}
:root{
  --paper:#F3EBDD;--ink:#16130E;--muted:#665E52;--terra:#D2622F;--terra-d:#A9461A;--terra-btn:#BF531D;
  --lilac:#E4DAF5;--lilac-2:#C9B8EE;--violet:#5A47C8;--card:#FFFDF8;--line:#E0D3BE;
  --ok:#2F7D57;--warn:#B26A00;--bad:#A33B3B;
  --navy:#16130E;--navy-2:#5A47C8;--gold:#D2622F;--gold-soft:#F7E3D6;--bg:#F3EBDD;
  --sky:#E9E1F7;--mint:#E4ECDD;--peach:#F8E4D6;
  --display:"Archivo","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;font-family:var(--display);font-size:1rem;line-height:1.55;color:var(--ink);padding-bottom:92px;
  background-color:var(--paper);
  background-image:linear-gradient(rgba(22,19,14,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(22,19,14,.055) 1px,transparent 1px);
  background-size:30px 30px}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(243,235,221,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.rib{flex:none;width:20px;height:28px;background:var(--terra);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
header.top h1{margin:0;font-size:1.05rem;font-weight:800;letter-spacing:-.01em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top small{display:block;color:var(--muted);font-size:.74rem;line-height:1.2}
.iconbtn{background:rgba(255,253,248,.9);color:var(--ink);border:1.5px solid rgba(22,19,14,.14);border-radius:999px;min-width:44px;min-height:44px;font:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:6px 18px 18px}
h2{font-size:2rem;font-weight:800;letter-spacing:-.035em;line-height:1.02;margin:14px 0 6px}
h3{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin:26px 0 8px}
p{margin:6px 0}
.lead{color:var(--muted)}
h2+.lead{font-family:var(--serif);font-size:1.18rem;line-height:1.4;color:var(--terra-d);margin-top:0}

/* ---- Inicio ---- */
.hero-title{margin:10px 0 14px;font-size:clamp(3.3rem,19vw,5.6rem);font-weight:800;letter-spacing:-.05em;line-height:.88}
.hero-title span{display:block}
.hero-title .t1{color:var(--terra)}
.stage{position:relative;border-radius:30px;padding:22px 20px 10px;overflow:hidden;
  background:linear-gradient(135deg,#EBDAE6 0%,#DACDF1 52%,#C5B5EA 100%);box-shadow:0 22px 44px -22px rgba(90,71,200,.55)}
.stage .big{margin:0;font-size:2.35rem;font-weight:500;letter-spacing:-.035em;line-height:1.02}
.stage .sub{margin:12px 0 4px;font-family:var(--serif);font-size:1.2rem;line-height:1.3;color:var(--terra-d)}
.stage .fine{margin:2px 0 0;font-size:.82rem;color:#3b3550}
.phones{position:relative;height:340px;margin-top:4px}
.ghost{position:absolute;top:44px;width:150px;height:270px;border-radius:26px;background:rgba(255,255,255,.34);border:2px solid rgba(255,255,255,.65)}
.ghost.l{left:-26px;transform:rotate(-9deg)}
.ghost.r{right:-26px;transform:rotate(9deg)}
.phone{position:absolute;left:50%;top:6px;width:196px;height:338px;margin-left:-98px;border-radius:32px;background:var(--ink);padding:7px;box-shadow:0 26px 40px -16px rgba(22,19,14,.55)}
.scr{position:relative;height:100%;border-radius:26px;background:#FBF7EF;padding:30px 11px 10px;overflow:hidden}
.scr:before{content:"";position:absolute;top:8px;left:50%;width:54px;height:14px;margin-left:-27px;border-radius:99px;background:var(--ink)}
.scr .mt{font-size:.62rem;font-weight:800;letter-spacing:-.01em;margin:0 0 5px}
.scr .pg{height:4px;border-radius:9px;background:#E9E2D3;margin-bottom:8px}
.scr .pg i{display:block;width:25%;height:100%;border-radius:9px;background:var(--terra)}
.scr .bub{font-family:var(--serif);font-style:italic;font-size:.66rem;line-height:1.3;background:var(--lilac);border-radius:12px 12px 12px 3px;padding:7px 8px;margin-bottom:8px}
.scr .op{display:flex;gap:5px;align-items:flex-start;background:#fff;border:1px solid #E6DCC9;border-radius:10px;padding:5px 6px;margin-bottom:5px;font-size:.56rem;line-height:1.3}
.scr .op b{flex:none;width:14px;height:14px;border-radius:5px;background:var(--terra);color:#fff;font-size:.5rem;display:flex;align-items:center;justify-content:center}
.scr .nv{position:absolute;left:11px;right:11px;bottom:9px;display:flex;justify-content:space-around}
.scr .nv i{width:14px;height:4px;border-radius:9px;background:#D9CFBC}
.scr .nv i:first-child{background:var(--terra)}
.orb{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 28%,#fff 0,#B7A3EB 42%,#765DD3 100%);box-shadow:0 8px 16px -6px rgba(90,71,200,.5)}
.orb.o1{width:30px;height:30px;top:28px;right:26px}
.orb.o2{width:44px;height:44px;bottom:26px;right:-8px}
.orb.o3{width:20px;height:20px;bottom:70px;left:10px}
@media (min-width:600px){
  .stage{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center;padding:26px 26px 18px}
  .phones{margin-top:0}
}
.eje{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer;font:inherit;color:inherit;min-height:72px}
.eje:last-of-type{border-bottom:0}
.eje .ti{flex:none;width:48px;height:48px;border-radius:14px;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center}
.eje .ti svg{width:26px;height:26px;stroke:#fff}
.eje b{display:block;font-size:1.08rem;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.eje span.d{display:block;font-size:.9rem;color:var(--muted);line-height:1.35}
.eje .ej{font-size:.78rem;color:var(--terra-d);font-weight:600}

/* ---- Superficies ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
.card.sky{background:var(--sky);border-color:#D8CCEE}
.card.mint{background:var(--mint);border-color:#D2DFC9}
.card.peach{background:var(--peach);border-color:#EFCFB9}
.card.lilac{background:#EBE4F8;border-color:#D8CCEE}
.card.gold{background:#F7E8CC;border-color:#EAD3A0}
.notice{background:#F2E6D6;border-left:5px solid var(--terra);border-radius:6px 16px 16px 6px;padding:13px 15px;font-size:.93rem;margin:16px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.tile{display:block;text-align:left;width:100%;border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--card);cursor:pointer;font:inherit;color:inherit;min-height:92px}
.tile b{display:block;margin-bottom:2px}
.tile span{font-size:.88rem;color:var(--muted)}
button,input,select,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 22px;border-radius:999px;border:2px solid var(--violet);background:var(--violet);color:#fff;font-weight:700;letter-spacing:-.005em;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:rgba(22,19,14,.4)}
.btn.gold{background:var(--terra-btn);border-color:var(--terra-btn);color:#fff}
.btn.small{min-height:40px;padding:6px 16px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label{display:block;font-weight:700;margin:14px 0 5px;font-size:.95rem}
input[type=text],input[type=time],input[type=date],select,textarea{width:100%;padding:12px 14px;border:1.5px solid #C9BBA3;border-radius:14px;background:#FFFDF8;min-height:48px;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

/* ---- Simulador ---- */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid rgba(22,19,14,.18);border-radius:18px;padding:14px 16px;margin:10px 0;cursor:pointer;color:var(--ink);min-height:54px;font-size:1rem;line-height:1.45}
.opt b{color:var(--terra-d);margin-right:6px}
.opt:hover:not([disabled]){border-color:var(--violet)}
.opt[disabled]{cursor:default}
.opt.chosen{border-color:var(--violet);background:var(--lilac);border-width:2px}
.say{font-family:var(--serif);font-style:italic;font-size:1.25rem;line-height:1.35;background:linear-gradient(135deg,#E9DEF4,#D9CCF1);border-radius:24px 24px 24px 6px;padding:16px 18px;margin:12px 0}
.tag{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--lilac);color:var(--ink)}
.tag.ok{background:#D9EBDF;color:#1F5F40}
.tag.mid{background:#F9E4B8;color:#6E4300}
.tag.low{background:#F4D5D2;color:#7C2A2A}
.bar{height:11px;border-radius:99px;background:rgba(22,19,14,.1);overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--terra)}
.progress{font-size:.85rem;color:var(--muted)}
.li{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin:9px 0;cursor:pointer;min-height:72px;font:inherit;color:inherit}
.li .n{flex:none;width:42px;height:42px;border-radius:13px;background:var(--terra);color:#fff;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center}
.li.done .n{background:var(--violet)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:700;letter-spacing:-.015em;line-height:1.25}
.li .t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.86rem;color:var(--muted)}
.li .chev{color:var(--muted);font-size:1.4rem;flex:none}

/* ---- Navegación ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom);
  background:rgba(255,253,248,.93);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:8px 2px 6px;min-height:60px;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span.ic{display:flex;align-items:center;justify-content:center;height:30px;width:52px;border-radius:999px;transition:background .18s}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:800}
nav.tabs button[aria-current=page] span.ic{background:var(--terra);color:#fff}
nav.tabs button[aria-current=page] svg{stroke:#fff}

details{border:0;border-top:1px solid var(--line);background:transparent;padding:2px 2px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:700;letter-spacing:-.01em;padding:14px 0;min-height:48px}
details p,details ul{margin:0 0 14px}
ul.clean,ol.clean{padding-left:20px;margin:6px 0}
.pre{white-space:pre-wrap;background:#FFFDF8;border:1.5px dashed #BBAA8E;border-radius:16px;padding:14px;font-size:.93rem}
.item{border:1px solid var(--line);border-radius:18px;padding:14px;margin:9px 0;background:var(--card)}
.item .meta,.meta{font-size:.82rem;color:var(--muted)}
.star{color:var(--terra)}
.likert{display:flex;gap:7px;flex-wrap:wrap}
.likert label{display:flex;align-items:center;justify-content:center;gap:4px;margin:0;border:1.5px solid #B9AA90;border-radius:999px;min-width:50px;min-height:48px;padding:0 12px;font-weight:700;cursor:pointer;background:#FFFDF8}
.likert input{margin:0}
.likert label:has(input:checked){background:var(--violet);color:#fff;border-color:var(--violet)}
.circle{width:150px;height:150px;border-radius:50%;margin:16px auto;background:radial-gradient(circle,#fff 0%,var(--lilac) 72%);border:4px solid var(--lilac-2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--violet);transition:transform 4s ease-in-out}
.circle.in{transform:scale(1.35)}
.circle.hold{transform:scale(1.35);transition-duration:0s}
.circle.out{transform:scale(.85);transition-duration:6s}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--ink);color:#fff;border-radius:999px;padding:11px 20px;font-size:.92rem;z-index:50;max-width:90%}
.toast[hidden]{display:none}
.modal{position:fixed;inset:0;background:rgba(22,19,14,.6);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.modal .box{background:var(--paper);border-radius:26px;max-width:680px;width:100%;max-height:92vh;overflow:auto;padding:18px}

/* ---- Pantalla de inicio: el único movimiento no pedido ---- */
#splash{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease}
#splash .rib{width:44px;height:62px;animation:drop .7s cubic-bezier(.2,.9,.3,1.2) both}
#splash h1{margin:14px 0 0;font-size:2.4rem;font-weight:800;letter-spacing:-.05em;line-height:1;animation:fadein .5s .35s ease both}
#splash h1 span{color:var(--terra)}
#splash p{margin:6px 0 0;font-family:var(--serif);font-style:italic;color:var(--terra-d);font-size:1.1rem;animation:fadein .5s .5s ease both}
#splash.hide{opacity:0;pointer-events:none}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.circle,.circle.out{transition:none!important}#splash,#splash *{animation:none!important;transition:none!important}}
body{-webkit-user-select:none;user-select:none}
input,textarea,.pre{-webkit-user-select:text;user-select:text}
.btn,.eje,.li,.opt,.iconbtn{transition:transform .12s ease;-webkit-tap-highlight-color:transparent}
.btn:active,.eje:active,.li:active,.opt:active:not([disabled]),.iconbtn:active{transform:scale(.97)}
#printArea{display:none}
@media print{
  header.top,nav.tabs,#app,.toast,.modal,#splash{display:none!important}
  #printArea{display:block!important}
  body{background:#fff;padding:0}
}
</style>
<script src="plantillas.js"></script>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="rib"></div><h1><span>Lidera</span>Conecta</h1><p>Escuchar para construir</p></div>
<header class="top">
  <div class="brand"><span class="rib" aria-hidden="true"></span><div style="min-width:0"><h1 id="ttl">LideraConecta</h1><small id="sub">Escuchar para construir</small></div></div>
  <div class="row" style="gap:8px;flex:none"><button class="iconbtn" id="infoBtn" aria-label="Información y privacidad">i</button><button class="iconbtn" id="fontBtn" aria-label="Cambiar tamaño de letra" title="Tamaño de letra">A+</button></div>
</header>
<div id="app"><main id="view" tabindex="-1"></main></div>
<nav class="tabs" id="tabs" aria-label="Secciones"></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div id="printArea"></div>

<script>
(function(){
'use strict';
var $ = function(s,r){return (r||document).querySelector(s)};
var esc = function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var norm = function(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()};
var store = {
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}}
};
var mem = {}; // respaldo si localStorage no está disponible
function load(k,d){var v=store.get(k,undefined);return v===undefined?(mem[k]!==undefined?mem[k]:d):v}
function save(k,v){mem[k]=v;store.set(k,v)}
function today(){return new Date().toLocaleDateString('es-EC',{day:'2-digit',month:'long',year:'numeric'})}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},2600)}
function copyText(txt){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast('Texto copiado')},function(){fallbackCopy(txt)});return} }catch(e){}
  fallbackCopy(txt);
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Texto copiado')}catch(e){toast('No se pudo copiar; selecciona el texto manualmente')}document.body.removeChild(ta)}
function printHTML(html){$('#printArea').innerHTML=html;setTimeout(function(){window.print()},50)}
function download(name,text,type){try{var b=new Blob([text],{type:type});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(a.href)},500)}catch(e){toast('No se pudo descargar en este navegador')}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- Casos ficticios del simulador ---------- */
var CASES=[
{id:'a',title:'Un informe entregado tarde',ctx:'Es jueves por la tarde. La Prof. Lucía Andrade (personaje ficticio) no entregó el informe de planificación que vencía el martes. Hoy llega a tu despacho.',
 steps:[
 {say:'“Sé que el informe venció el martes. Tuve una emergencia en mi familia y no pude terminarlo. Lamento el retraso.”',opts:[
  {t:'La fecha estaba clara. Corresponde aplicar el llamado de atención por incumplimiento.',type:'sancionadora',emp:0,as:1,re:0,rx:'Lucía baja la mirada: “Entiendo. No volverá a pasar.” Ya no cuenta nada más.',fb:'La respuesta prioriza la norma y cierra la conversación. El docente se queda con temor y sin espacio para explicar lo que ocurre.'},
  {t:'Entrégalo cuando puedas, no hay problema.',type:'neutra',emp:1,as:0,re:1,rx:'Lucía duda: “Gracias... pero ¿hasta cuándo? No quiero seguir atrasada.”',fb:'Alivia la presión, pero no deja un acuerdo claro. La falta de fecha genera incertidumbre para ambas partes.'},
  {t:'Gracias por venir a explicarme. Lamento lo que pasó en tu familia. ¿Cómo estás y qué necesitas para ponerte al día?',type:'restaurativa',emp:2,as:1,re:2,rx:'Lucía respira hondo: “Estoy cansada, pero quiero cumplir. Con tres días más lo termino.”',fb:'Escucha primero, reconoce a la persona y abre el diálogo antes de hablar de la tarea. Es la base del enfoque restaurativo.'}]},
 {say:'“Entonces, ¿cómo quedamos con la entrega y con los otros informes del mes?”',opts:[
  {t:'Rigen las mismas fechas para todos. No hay excepciones.',type:'sancionadora',emp:0,as:1,re:0,rx:'Lucía asiente en silencio. Su expresión se endurece.',fb:'Es claro, pero rígido: no considera la situación y puede reducir la confianza para avisar a tiempo de futuras dificultades.'},
  {t:'Veremos sobre la marcha.',type:'neutra',emp:1,as:0,re:0,rx:'Lucía frunce el ceño: “¿Y si me piden algo más sin avisar?”',fb:'Deja el tema abierto. La falta de definición mantiene la incertidumbre que se quiere reducir.'},

var LEX={
 emp:['gracias','entiendo','comprendo','lamento','siento','como estas','como te sientes','escuch','valoro','reconozco','aprecio','apoyo','acompan','estoy para'],
 as:['acordamos','acordemos','plazo','fecha','propongo','necesito','te pido','hasta el','antes del','compromiso','quedamos','coordinamos','revisamos','seguimiento','el lunes','el martes','el miercoles','el jueves','el viernes'],
 re:['juntos','juntas','que necesitas','que propones','como podemos','propuesta','aprender','revisar','alternativa','acuerdo','dialogo','construir','entre los dos','entre ambos'],
 pun:['sancion','memorando','castigo','inaceptable','obligatorio','debes','tienes que','nunca','siempre','falta grave','expediente','advertencia','amonest','llamado de atencion']
};
function countHits(t,list){var n=0;list.forEach(function(w){if(t.indexOf(w)>-1)n++});return n}
function analyze(text){
  var t=norm(text), e=countHits(t,LEX.emp), a=countHits(t,LEX.as)+(/\d/.test(t)?1:0), r=countHits(t,LEX.re), p=countHits(t,LEX.pun);
  var emp=Math.min(2,e), as=Math.min(2,a), re=Math.min(2,r);
  if(p>0){emp=Math.max(0,emp-1);re=Math.max(0,re-1)}
  var tips=[];
  if(text.trim().length<40)tips.push('Amplía un poco tu mensaje (2 a 4 líneas) para que la otra persona entienda tu intención.');
  if(emp<2)tips.push('Reconoce primero a la persona: agradece su apertura o pregunta cómo se siente.');
  if(as<2)tips.push('Sé claro con lo acordado: indica qué, cuándo y quién (un plazo o una fecha de seguimiento).');
  if(re<2)tips.push('Invita a construir juntos: pregunta qué necesita o qué propone la otra persona.');

/* ---------- Simulador ---------- */
function maxFor(ci){
  var c=CASES[ci],m={emp:2,as:2,re:2};
  var sum={emp:0,as:0,re:0};
  c.steps.forEach(function(s){['emp','as','re'].forEach(function(k){sum[k]+=Math.max.apply(null,s.opts.map(function(o){return o[k]}))})});
  ['emp','as','re'].forEach(function(k){sum[k]+=m[k]});
  return sum;
}
function vSim(){
  if(S.c===null)return simList();
  var c=CASES[S.c],h='';

  h+='<h2>'+esc(c.title)+'</h2>';
  var total=c.steps.length+2, cur=S.phase==='choice'?S.step+1:(S.phase==='message'?c.steps.length+1:total);
  if(S.phase==='result')cur=total;
  h+='<p class="progress">Momento '+cur+' de '+total+'</p><div class="bar"><i style="width:'+Math.round(cur/total*100)+'%"></i></div>';
  h+='<div class="card peach"><b>Situación (ficticia)</b><p>'+esc(c.ctx)+'</p></div>';
  if(S.phase==='choice')h+=simChoice(c);
  else if(S.phase==='message')h+=simMessage(c);

  else h+=simResult(c);
  return h;
}

function drawDip(x,k,name){
  var maxW=300*k,size=23*k,f;
  x.textAlign='center';x.textBaseline='alphabetic';x.fillStyle='#4E6B5B';
  while(true){f='italic 700 '+size+'px Georgia,"Times New Roman",serif';x.font=f;if(x.measureText(name).width<=maxW||size<=12*k)break;size-=k*0.5}
  x.fillText(name,265.5*k,196.5*k);
}
function tokensMes(name){
  var t=[],nm=name.split(/\s+/);
  nm.forEach(function(w){t.push([{t:w}])});
  'ha mostrado una pasión inigualable por su trabajo y ha sido una fuente constante de'.split(' ').forEach(function(w){t.push([{t:w}])});
  t.push([{t:'motivación',b:1,i:1},{t:'.'}]);
  '¡Gracias por ser tan inspirador,'.split(' ').forEach(function(w){t.push([{t:w}])});
  nm.forEach(function(w,i){t.push([{t:w+(i===nm.length-1?'!':'')}])});
  return t;
}
function drawMes(x,k,name){
  // parche sobre el texto de ejemplo del párrafo (fondo amarillo plano)
  x.fillStyle='#FEBF00';x.fillRect(40*k,130*k,212*k,94*k);
  var x0=45*k,W=197.7*k,y0=144*k,fam='Montserrat,"Trebuchet MS","Segoe UI",Arial,sans-serif';
  function layout(fs){
    function fnt(p){return (p.i?'italic ':'')+(p.b?'700 ':'500 ')+fs+'px '+fam}
    function wordW(tok){var w=0;tok.forEach(function(p){x.font=fnt(p);w+=x.measureText(p.t).width});return w}
    x.font='500 '+fs+'px '+fam;var sp=x.measureText(' ').width;
    var toks=tokensMes(name).map(function(t){return {t:t,w:wordW(t)}}),lines=[],cur=[],cw=0;
    toks.forEach(function(tk){var need=cur.length?cw+sp+tk.w:tk.w;if(need>W&&cur.length){lines.push(cur);cur=[tk];cw=tk.w}else{cur.push(tk);cw=need}});
    if(cur.length)lines.push(cur);
    return {lines:lines,sp:sp,fnt:fnt};
  }
  var fs=11.4*k,L=layout(fs);
  while(L.lines.length>6&&fs>8*k){fs-=0.3*k;L=layout(fs)}
  var lh=(L.lines.length>5?fs*1.3:15.4*k);
  x.textAlign='left';x.textBaseline='alphabetic';x.fillStyle='#1b1b1b';
  L.lines.forEach(function(ln,li){
    var tw=ln.reduce(function(a,t){return a+t.w},0),gaps=ln.length-1;
    var gap=(li<L.lines.length-1&&gaps>0)?(W-tw)/gaps:L.sp,cx=x0;
    ln.forEach(function(tk){tk.t.forEach(function(p){x.font=L.fnt(p);x.fillText(p.t,cx,y0+li*lh);cx+=x.measureText(p.t).width});cx+=gap});
  });
  // nombre grande en la etiqueta blanca
  x.fillStyle='#FFFFFF';x.fillRect(224*k,322*k,216*k,52*k);
  var up=name.toUpperCase(),SX=0.78,maxW=206*k,cx2=331*k,cy=350*k,size=40*k;
  function wid(t,sz){x.font='800 '+sz+'px Arial,Helvetica,sans-serif';return x.measureText(t).width*SX}
  var linesN=[up];
  while(wid(up,size)>maxW&&size>26*k)size-=k;
  if(wid(up,size)>maxW){
    var w=up.split(' '),best=1,diff=1e9;
    for(var i=1;i<w.length;i++){var d=Math.abs(w.slice(0,i).join(' ').length-w.slice(i).join(' ').length);if(d<diff){diff=d;best=i}}
    linesN=w.length>1?[w.slice(0,best).join(' '),w.slice(best).join(' ')]:[up];
    size=30*k;
    while(Math.max.apply(null,linesN.map(function(l){return wid(l,size)}))>maxW&&size>14*k)size-=k*0.5;
  }
  x.fillStyle='#1b1b1b';x.textAlign='center';x.textBaseline='alphabetic';
  var cap=0.72*size,lhN=size*0.98,top=cy-((linesN.length-1)*lhN)/2+cap/2;
  linesN.forEach(function(l,i){x.save();x.translate(cx2,top+i*lhN);x.scale(SX,1);x.font='800 '+size+'px Arial,Helvetica,sans-serif';x.fillText(l,0,0);x.restore()});
}
function certCanvas(kind,name){
  var src=kind==='mes'?PL.docente:PL.diploma;
  if(!src)return Promise.reject(new Error('Falta la plantilla'));
  return loadImg(src).then(function(im){
    var DW=kind==='mes'?447:531,DH=DW*im.naturalHeight/im.naturalWidth;
    var outW=Math.max(im.naturalWidth,kind==='mes'?1400:1800),k=outW/DW,outH=Math.round(DH*k);
    var c=document.createElement('canvas');c.width=outW;c.height=outH;
    var x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
    x.drawImage(im,0,0,outW,outH);
    if(kind==='mes')drawMes(x,k,name);else drawDip(x,k,name);
    return c;
  });
}

  if(a==='gendesc'){
    var d={ini:$('#dini').value||'18:00',fin:$('#dfin').value||'07:00',fds:$('#dfds').checked};save('lc_desc',d);
    var txt2='INSTRUCTIVO DE DESCONEXIÓN DIGITAL (BORRADOR)\nUnidad Educativa “25 de Junio”\n\n1. Horario de descanso: de '+d.ini+' a '+d.fin+(d.fds?', y durante fines de semana y feriados':'')+'.\n2. Fuera de ese horario no se espera respuesta a mensajes de trabajo, salvo una emergencia institucional declarada por el directivo.\n3. Los requerimientos administrativos se comunican por el canal oficial con al menos 24 horas de anticipación.\n4. Lo que llegue fuera del horario se atiende el siguiente día hábil.\n5. Este instructivo se revisa cada trimestre en junta docente.';
    $('#descOut').innerHTML='<div class="pre" id="descTxt" style="margin-top:12px">'+esc(txt2)+'</div><div class="row" style="margin-top:8px"><button class="btn alt small" data-act="copydesc">Copiar texto</button></div>';return;
  }
  if(a==='copydesc')return copyText($('#descTxt').textContent);
  if(a==='genmsg'){
    var asu=($('#masu').value||'').trim(),det=($('#mdet').value||'').trim(),fec=$('#mfec').value;
    if(!asu||!det||!fec){$('#msgOut').innerHTML='<p role="alert" style="color:var(--bad)">Completa asunto, fecha y detalle.</p>';return}
    var f=new Date(fec+'T12:00:00').toLocaleDateString('es-EC',{weekday:'long',day:'2-digit',month:'long'});
    var m='Asunto: '+asu+'\n\nEstimados docentes:\n\nCompartimos con anticipación el siguiente requerimiento institucional:\n\n'+det+'\n\nFecha de entrega: '+f+'.\nCanal oficial de respuesta y consultas: dentro del horario laboral.\n\nSi necesitan apoyo o ajustar los tiempos, escríbannos antes de esa fecha para acordar una alternativa.\n\nGracias por su compromiso.\nEquipo directivo';
    $('#msgOut').innerHTML='<div class="pre" id="msgTxt" style="margin-top:12px">'+esc(m)+'</div><div class="row" style="margin-top:8px"><button class="btn alt small" data-act="copymsg">Copiar texto</button></div>';return;
  }
  if(a==='copymsg')return copyText($('#msgTxt').textContent);
  if(a==='expbuzon'){
    var bz=load('lc_buzon',[]).filter(function(x){return !x.ej});
    if(!bz.length){toast('Aún no hay sugerencias para descargar');return}
    var rows=[['N°','Fecha de envío','Tema','Rol','Nivel o área','Nombre','Sugerencia','Estado','Respuesta del directivo','Fecha de respuesta']];
    bz.forEach(function(x,i){rows.push([i+1,x.iso||x.fecha||'',x.cat||'',x.rol||'Sin dato',x.niv||'Sin dato',x.nom?x.nom:'Anónimo',x.txt||'',x.estado||'',x.resp||'',x.fresp||''])});
    return download('buzon_sugerencias_'+stamp()+'.csv','﻿'+toCSV(rows),'text/csv;charset=utf-8');
  }
  if(a==='expjson'){var u=load('lc_pruebas',[]);return download('prueba_temprana_lideraconecta.json',JSON.stringify({instrumento:QS,dimensiones:QN,usuarios:u},null,2),'application/json')}
  if(a==='expcsv'){var u2=load('lc_pruebas',[]),prow=[['Usuario','Rol'].concat(QN).concat(['Error','Detalle del error','Sugerencia'])];u2.forEach(function(x,i){prow.push(['U'+(i+1),x.rol].concat(x.r).concat([x.err,x.errt||'',x.sug||'']))});return download('prueba_temprana_lideraconecta.csv','﻿'+toCSV(prow),'text/csv;charset=utf-8')}
  if(a==='pclear'){if(el.getAttribute('data-ok')){save('lc_pruebas',[]);return render()}el.setAttribute('data-ok','1');el.textContent='Confirmar: borrar todo';return}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='dirMode'){dirMode=el.checked;return render()}
  var a=el.getAttribute&&el.getAttribute('data-act');
  if(a==='estado'||a==='resp'){
    var items=load('lc_buzon',[]),id=+el.getAttribute('data-id');
    items.forEach(function(x){if(x.id===id){if(a==='estado')x.estado=el.value;else x.resp=el.value.trim();if(x.resp||x.estado===ESTADOS[2])x.fresp=stamp()}});
    save('lc_buzon',items);if(a==='estado')render();else toast('Respuesta guardada');
  }
});
document.addEventListener('submit',function(e){
  var f=e.target.getAttribute('data-form');if(!f)return;e.preventDefault();
  if(f==='buzon'){var it=load('lc_buzon',[]);it.push({id:Date.now(),cat:$('#bcat').value,rol:$('#brol').value,niv:$('#bniv').value,nom:$('#bnom').value.trim(),txt:$('#btxt').value.trim(),fecha:new Date().toLocaleDateString('es-EC'),iso:stamp(),estado:ESTADOS[0],resp:'',fresp:''});save('lc_buzon',it);toast('Sugerencia recibida');render()}
  if(f==='huella'){var hs=load('lc_huellas',[]);hs.push({id:Date.now(),n:$('#hn').value.trim(),i:$('#hi').value.trim(),c:$('#hc').value,d:today(),star:false});save('lc_huellas',hs);toast('Agregado al muro');render()}
  if(f==='prueba'){
    var us=load('lc_pruebas',[]);if(us.length>=5)return;
    var r=QS.map(function(q,i){var c=document.querySelector('input[name=q'+i+']:checked');return c?+c.value:0});
    us.push({rol:$('#prol').value,r:r,err:$('#perr').value,errt:$('#perrt').value.trim(),sug:$('#psug').value.trim(),fecha:new Date().toLocaleDateString('es-EC')});
    save('lc_pruebas',us);toast('Respuesta guardada');render();window.scrollTo(0,0);
  }
});
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal')$('#modal').hidden=true});
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('#modal').hidden=true});
$('#infoBtn').addEventListener('click',function(){
  $('#modalBox').innerHTML='<h3 style="margin-top:0">Información y privacidad</h3><div class="notice"><b>Aviso de privacidad.</b> Prototipo educativo. No ingreses datos personales de docentes ni casos disciplinarios reales. Todos los casos son ficticios. La orientación es un apoyo; la decisión final es siempre del directivo.</div><p class="lead">Los datos se guardan solo en este dispositivo. Los casos y criterios de retroalimentación fueron elaborados con apoyo de IA y deben ser revisados por la autora antes de cualquier uso con personal real.</p><div class="row" style="margin-top:12px"><button class="btn" data-act="closemodal">Entendido</button></div>';
  $('#modal').hidden=false;
});
setTimeout(function(){var sp=$('#splash');if(sp){sp.classList.add('hide');setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp)},600)}},1500);
try{if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}}catch(e){}
var fs=0;$('#fontBtn').addEventListener('click',function(){fs=(fs+1)%3;document.documentElement.style.fontSize=['100%','112%','125%'][fs]});

render();
})();
</script>
</body>
</html>
